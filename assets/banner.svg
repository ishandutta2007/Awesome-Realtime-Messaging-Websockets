<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0C1427" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <!-- Filter Effects -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      /* Keyframe Animations */
      @keyframes pulseRing {
        0% { r: 12px; opacity: 0.9; stroke-width: 3px; }
        50% { r: 48px; opacity: 0.3; stroke-width: 1.5px; }
        100% { r: 84px; opacity: 0; stroke-width: 0.5px; }
      }

      @keyframes streamFlowForward {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes streamFlowBackward {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }

      @keyframes floatBadge1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }

      @keyframes floatBadge2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }

      @keyframes floatBadge3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes beaconGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }

      .pulse-1 { animation: pulseRing 3.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
      .pulse-2 { animation: pulseRing 3.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1.75s; }
      .stream-fwd { stroke-dasharray: 12, 16; animation: streamFlowForward 5s linear infinite; }
      .stream-bwd { stroke-dasharray: 10, 14; animation: streamFlowBackward 6s linear infinite; }
      .float-1 { animation: floatBadge1 6s ease-in-out infinite; }
      .float-2 { animation: floatBadge2 7s ease-in-out infinite; }
      .float-3 { animation: floatBadge3 5.5s ease-in-out infinite; }
      .beacon { animation: beaconGlow 4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Background Ambient Glows -->
  <circle cx="150" cy="80" r="180" fill="url(#glowCyan)" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="1060" cy="340" r="220" fill="url(#glowPurple)" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="950" cy="90" r="130" fill="url(#glowCyan)" opacity="0.18" filter="url(#softGlow)" />

  <!-- Animated Realtime Data Streams (Background/Midground) -->
  <g opacity="0.65">
    <!-- Stream Line 1: Upper Left to Lower Right -->
    <path d="M 60 70 Q 300 20 600 80 T 1140 90" fill="none" stroke="#38BDF8" stroke-width="2" class="stream-fwd" opacity="0.6" />
    
    <!-- Stream Line 2: Bidirectional Cross Flow -->
    <path d="M 80 350 Q 350 400 650 330 T 1120 340" fill="none" stroke="#818CF8" stroke-width="2.5" class="stream-bwd" opacity="0.55" />
    
    <!-- Stream Line 3: Vertical S-Curve Orbit -->
    <path d="M 120 200 C 260 110, 320 310, 480 210 S 780 120, 1080 220" fill="none" stroke="#C084FC" stroke-width="1.8" class="stream-fwd" opacity="0.4" />
  </g>

  <!-- Interactive Nodes / Pulse Centers -->
  <g transform="translate(140, 130)">
    <circle cx="0" cy="0" r="8" fill="#38BDF8" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#38BDF8" class="pulse-1" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#38BDF8" class="pulse-2" />
  </g>

  <g transform="translate(1060, 280)">
    <circle cx="0" cy="0" r="8" fill="#A855F7" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#C084FC" class="pulse-1" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#C084FC" class="pulse-2" />
  </g>

  <!-- Floating Tech Badges (Midground - positioned safely away from center text) -->
  <g class="float-1" transform="translate(80, 270)">
    <rect width="145" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8" filter="url(#badgeShadow)" />
    <circle cx="20" cy="18" r="5" fill="#34D399" />
    <text x="35" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">WebSocket / wss</text>
  </g>

  <g class="float-2" transform="translate(970, 75)">
    <rect width="140" height="36" rx="18" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.8" filter="url(#badgeShadow)" />
    <circle cx="20" cy="18" r="5" fill="#38BDF8" />
    <text x="35" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Pub/Sub Engine</text>
  </g>

  <g class="float-3" transform="translate(980, 335)">
    <rect width="135" height="36" rx="18" fill="#0F172A" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.8" filter="url(#badgeShadow)" />
    <circle cx="20" cy="18" r="5" fill="#F472B6" />
    <text x="35" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SSE &amp; Streaming</text>
  </g>

  <g class="float-2" transform="translate(70, 50)">
    <rect width="130" height="34" rx="17" fill="#0F172A" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.6" filter="url(#badgeShadow)" />
    <circle cx="18" cy="17" r="4.5" fill="#38BDF8" />
    <text x="32" y="22" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Sub-10ms Latency</text>
  </g>

  <!-- FOREGROUND HERO CONTAINER (Z-Index on top, perfectly centered and prominent) -->
  <g transform="translate(190, 48)">
    <!-- Backplate Card for High Contrast Legibility -->
    <rect width="820" height="324" rx="24" fill="#090E1C" fill-opacity="0.88" stroke="#1E293B" stroke-width="1.5" filter="url(#badgeShadow)" />
    <rect width="820" height="324" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.3" />

    <!-- Top Tagline Pill -->
    <g transform="translate(265, 30)">
      <rect width="290" height="28" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
      <text x="145" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">📡 REAL-TIME INFRASTRUCTURE HUB</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(410, 115)">
      <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-weight="900" font-size="37" letter-spacing="-0.5">
        <tspan fill="#FFFFFF">AWESOME </tspan>
        <tspan fill="url(#accentGrad)">REALTIME MESSAGING</tspan>
      </text>
      <text y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="2" fill="#94A3B8">
        &amp; WEBSOCKETS
      </text>
    </g>

    <!-- Subtitle -->
    <text x="410" y="202" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      A curated ecosystem of SaaS platforms &amp; open-source projects for bidirectional
    </text>
    <text x="410" y="225" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Pub/Sub messaging, persistent connections, connection recovery &amp; self-hosted servers
    </text>

    <!-- Feature Attribute Badges inside Hero Card -->
    <g transform="translate(65, 260)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="158" height="32" rx="8" fill="#131C31" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
        <text x="79" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Ultra-Low Latency</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(174, 0)">
        <rect width="168" height="32" rx="8" fill="#131C31" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4" />
        <text x="84" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔄 Bidirectional Pub/Sub</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(358, 0)">
        <rect width="158" height="32" rx="8" fill="#131C31" stroke="#C084FC" stroke-width="1" stroke-opacity="0.4" />
        <text x="79" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Self-Hosted &amp; SaaS</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(532, 0)">
        <rect width="158" height="32" rx="8" fill="#131C31" stroke="#34D399" stroke-width="1" stroke-opacity="0.4" />
        <text x="79" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Resilient Recovery</text>
      </g>
    </g>
  </g>
</svg>
